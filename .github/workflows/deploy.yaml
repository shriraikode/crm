name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: crm-staging-466717
  REGION: us-central1
  FRONTEND_SERVICE: <YOUR_FRONTEND_SERVICE_NAME>
  BACKEND_SERVICE: <YOUR_BACKEND_SERVICE_NAME>
  FRONTEND_DIR: web
  BACKEND_DIR: api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Build and push frontend Docker image
        run: |
          cd $FRONTEND_DIR
          docker build -t gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:latest .
          docker push gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:latest

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy $FRONTEND_SERVICE \
            --image gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:latest \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated

      - name: Build and push backend Docker image
        run: |
          cd ../$BACKEND_DIR
          docker build -t gcr.io/$PROJECT_ID/$BACKEND_SERVICE:latest .
          docker push gcr.io/$PROJECT_ID/$BACKEND_SERVICE:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy $BACKEND_SERVICE \
            --image gcr.io/$PROJECT_ID/$BACKEND_SERVICE:latest \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated